<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>射箭计时系统 - 启动日志</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0a0a0a;
      color: #00ff00;
    }

    .header {
      background: linear-gradient(90deg, #1a1a1a 0%, #2d2d2d 100%);
      padding: 20px;
      border-bottom: 2px solid #00ff00;
      box-shadow: 0 2px 10px rgba(0, 255, 0, 0.2);
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }

    .header p {
      font-size: 12px;
      color: #888;
    }

    .header .console-url {
      font-size: 14px;
      color: #00ff00;
      margin-top: 5px;
      text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
      font-family: 'Courier New', monospace;
      padding: 5px 10px;
      background: rgba(0, 255, 0, 0.1);
      border: 1px solid rgba(0, 255, 0, 0.3);
      border-radius: 4px;
      display: inline-block;
    }

    .log-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #0a0a0a;
    }

    .log-message {
      padding: 8px 12px;
      margin: 4px 0;
      border-left: 3px solid #00ff00;
      background: rgba(0, 255, 0, 0.05);
      font-size: 13px;
      line-height: 1.5;
      word-break: break-all;
      animation: slideIn 0.3s ease;
    }

    .log-message.error {
      border-left-color: #ff4d4f;
      background: rgba(255, 77, 79, 0.05);
      color: #ff7875;
    }

    .log-message.warning {
      border-left-color: #faad14;
      background: rgba(250, 173, 20, 0.05);
      color: #ffc53d;
    }

    .log-message.success {
      border-left-color: #52c41a;
      background: rgba(82, 196, 26, 0.05);
      color: #85ce61;
    }

    .log-message.info {
      border-left-color: #1890ff;
      background: rgba(24, 144, 255, 0.05);
      color: #69b1ff;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer {
      background: #1a1a1a;
      padding: 15px;
      border-top: 1px solid #333;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00ff00;
      margin-right: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      background: #1890ff;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
    }

    button:hover {
      background: #40a9ff;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    /* 滚动条样式 */
    .log-container::-webkit-scrollbar {
      width: 8px;
    }

    .log-container::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    .log-container::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    .log-container::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 射箭比赛计时系统 - 启动日志</h1>
      <p>System Startup Log | 系统启动日志</p>
<!--      <p>控制台页面: http://localhost:3000</p>-->
      <p class="console-url">控制台页面: http://localhost:3000</p>
    </div>

    <div class="log-container" id="logContainer">
      <div class="log-message info">
        ℹ️ [初始化] 正在启动射箭比赛计时系统...
      </div>
      <div class="log-message info">
        ℹ️ [初始化] 加载系统配置...
      </div>
    </div>

    <div class="footer">
      <div>
        <span class="status-indicator"></span>
        <span>系统运行中</span>
      </div>
      <div class="button-group">
        <button id="clearBtn">清空日志</button>
        <button id="copyBtn">复制日志</button>
        <button id="hideBtn">隐藏窗口</button>
      </div>
    </div>
  </div>

  <script>
    const logContainer = document.getElementById('logContainer');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');

    // 监听日志消息
    if (window.electronAPI) {
      window.electronAPI.onLogMessage((message) => {
        addLog(message);
      });
    }

    // 添加日志消息
    function addLog(message) {
      const logMessage = document.createElement('div');
      logMessage.className = 'log-message';

      // 根据消息内容判断日志类型
      if (message.includes('❌') || message.includes('[后端-错误]')) {
        logMessage.classList.add('error');
      } else if (message.includes('⚠️') || message.includes('[警告]')) {
        logMessage.classList.add('warning');
      } else if (message.includes('✅') || message.includes('[成功]')) {
        logMessage.classList.add('success');
      } else if (message.includes('ℹ️') || message.includes('[信息]')) {
        logMessage.classList.add('info');
      }

      logMessage.textContent = message;
      logContainer.appendChild(logMessage);

      // 自动滚动到底部
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // 清空日志
    clearBtn.addEventListener('click', () => {
      logContainer.innerHTML = '';
      addLog('📝 日志已清空');
    });

    // 复制日志
    copyBtn.addEventListener('click', () => {
      const logText = Array.from(logContainer.querySelectorAll('.log-message'))
        .map(el => el.textContent)
        .join('\n');

      navigator.clipboard.writeText(logText).then(() => {
        alert('日志已复制到剪贴板');
      }).catch(() => {
        alert('复制失败，请重试');
      });
    });

    // 隐藏窗口按钮
    const hideBtn = document.getElementById('hideBtn')
    hideBtn.addEventListener('click', () => {
      if (window.electronAPI?.minimizeWindow) {
        window.electronAPI.minimizeWindow()
      } else {
        // 如果没有electronAPI，尝试关闭窗口
        window.close()
      }
    })

    // 页面加载完成提示
    window.addEventListener('load', () => {
      addLog('✅ [系统] 日志窗口已加载，等待启动信息...')
      addLog('ℹ️ [提示] 按 Ctrl+L 可再次显示此窗口')
    });
  </script>
</body>
</html>
